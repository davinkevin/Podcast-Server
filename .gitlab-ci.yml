include:
  - local: .gitlab/ci/container-analysis.yaml
  - local: .gitlab/ci/gradle-build-tool.yaml
  - local: .gitlab/ci/documentation.yaml
  - local: .gitlab/ci/maintenance.yaml

default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # Single identity used to attribute Develocity Build Scans in CI, shared by
  # Gradle (-Duser.name below) and the npm agent (DEVELOCITY_USER_NAME).
  CI_SCAN_USER: davin.kevin+gitlab-ci-runner-podcast-server
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Duser.name=$CI_SCAN_USER"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle_home
  YARN_CACHE_FOLDER: $CI_PROJECT_DIR/.yarn
  DEVELOCITY_SERVER: https://develocity.davinkevin.fr

stages:
  - ⬇ download
  - 👷‍ build
  - 🐳 packaging
  - 🧪 test
  - 🔎 Security Analysis
  - 🚀 deploy
  - 🧹 maintenance

⬇ backend:
  stage: ⬇ download
  extends: [ .only-on-backend-changes ]
  needs: [⬇ build-tool]
  image: gradle:jdk21
  script:
    - ./gradlew $GRADLE_OPTS :backend:downloadDependencies :backend-lib-youtubedl:downloadDependencies :backend-lib-database:downloadDependencies
  cache:
    - !reference [ .using-build-tool ]
    - key:
        files:
          - backend/build.gradle.kts
        prefix: "backend"
      paths:
        - .gradle
        - .gradle_home/caches
        - backend/build

⬇ ui-v3:
  stage: ⬇ download
  extends: [ .only-on-frontend-changes ]
  needs: []
  image: node:24.19.0
  script:
    - cd frontend-angular
    - npm ci
  cache:
    - key:
        files:
          - frontend-angular/package-lock.json
        prefix: "ui-v3"
      paths:
        - frontend-angular/node_modules/

🧪 backend:
  stage: 🧪 test
  extends: [ .only-on-backend-changes ]
  image: gradle:jdk21
  needs: [⬇ backend]
  services:
    - postgres:18.6-alpine
  variables:
    POSTGRES_USER: pg-user
    POSTGRES_PASSWORD: LUiUwCfPwhGx1rQaUJEa7L09mdifP1Es
    POSTGRES_DB: podcast-server-db
  script:
    - ./gradlew $GRADLE_OPTS backend-lib-database:flywayMigrate :backend:test backend:koverLog backend:koverHtmlReport
  artifacts:
    paths:
      - backend/build/reports/kover/html/**/*
    reports:
      junit: backend/build/test-results/test/TEST-*.xml
  coverage: '/^application line coverage:\s(\d+\.\d+%)/'
  cache:
    - !reference [ .using-build-tool ]
    - key:
        files:
          - backend/build.gradle.kts
        prefix: "backend"
      policy: pull
      paths:
        - .gradle
        - .gradle_home/caches
        - backend/build
  retry: 2

🧪 database:
  stage: 🧪 test
  extends: [ .only-on-backend-changes ]
  image: gradle:jdk21
  needs: [⬇ backend]
  services:
    - postgres:18.6-alpine
  variables:
    POSTGRES_USER: pg-user
    POSTGRES_PASSWORD: LUiUwCfPwhGx1rQaUJEa7L09mdifP1Es
    POSTGRES_DB: podcast-server-db
  script:
    - ./gradlew $GRADLE_OPTS backend-lib-database:generateJooq
    - git diff || true
    - git diff-index --quiet HEAD -- || exit 8
  cache:
    - !reference [ .using-build-tool ]
    - key:
        files:
          - backend/build.gradle.kts
        prefix: "backend"
      policy: pull
      paths:
        - .gradle
        - .gradle_home/caches
  retry: 2

🧪 ui-v3:
  stage: 🧪 test
  extends: [ .only-on-frontend-changes ]
  image: node:24.19.0
  needs: [⬇ ui-v3]
  variables:
    # Publish a Build Scan for the native npm test run through the Develocity
    # npm agent (installed as a devDependency). DEVELOCITY_ACCESS_KEY is provided
    # as a project CI/CD variable (same one the Gradle build scans use).
    NODE_OPTIONS: "-r @gradle-tech/develocity-agent/preload"
    DEVELOCITY_URL: $DEVELOCITY_SERVER
    # Force the scan user: CI runs as root in the node image, so without this the
    # Build Scans would be attributed to "root". Shared with the Gradle scans via
    # the top-level CI_SCAN_USER variable.
    DEVELOCITY_USER_NAME: $CI_SCAN_USER
  script:
    - cd frontend-angular
    - npm run test
  cache:
    - key:
        files:
          - frontend-angular/package-lock.json
        prefix: "ui-v3"
      policy: pull
      paths:
        - frontend-angular/node_modules/
  retry: 2

👷 backend-base-image:
  stage: 👷‍ build
  extends: [ .only-on-backend-changes ]
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - !reference [ .cicd_utils ]
    - kaniko_auth_docker_hub
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/backend/src/main/base-image/Dockerfile --destination podcastserver/backend-base-image:${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}

👷 ui-v3:
  stage: 👷‍ build
  extends: [ .only-on-frontend-changes ]
  image: node:24.19.0
  needs: [⬇ ui-v3]
  variables:
    # Publish a Build Scan for the native npm build through the Develocity npm
    # agent. DEVELOCITY_ACCESS_KEY is provided as a project CI/CD variable.
    NODE_OPTIONS: "-r @gradle-tech/develocity-agent/preload"
    DEVELOCITY_URL: $DEVELOCITY_SERVER
    # Force the scan user: CI runs as root in the node image, so without this the
    # Build Scans would be attributed to "root". Shared with the Gradle scans via
    # the top-level CI_SCAN_USER variable.
    DEVELOCITY_USER_NAME: $CI_SCAN_USER
  script:
    - cd frontend-angular
    - npm run build
  artifacts:
    paths:
      - frontend-angular/dist/
  cache:
    - key:
        files:
          - frontend-angular/package-lock.json
        prefix: "ui-v3"
      policy: pull
      paths:
        - frontend-angular/node_modules/

🐳 backend:
  stage: 🐳 packaging
  extends: [ .only-on-backend-changes ]
  image: gradle:jdk21
  needs: [⬇ backend, 👷 backend-base-image]
  services:
    - postgres:18.6-alpine
  variables:
    POSTGRES_USER: pg-user
    POSTGRES_PASSWORD: LUiUwCfPwhGx1rQaUJEa7L09mdifP1Es
    POSTGRES_DB: podcast-server-db
  script:
    - ./gradlew $GRADLE_OPTS :backend:jib
  cache:
    - !reference [ .using-build-tool ]
    - key:
        files:
          - backend/build.gradle.kts
        prefix: "backend"
      policy: pull
      paths:
        - .gradle
        - .gradle_home/caches
        - backend/build
🐳 init-db:
  stage: 🐳 packaging
  extends: [ .only-on-backend-changes ]
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - !reference [ .cicd_utils ]
    - kaniko_auth_docker_hub
  script:
    # kaniko pushes every --destination out of a single build, so the tags cannot
    # drift apart and the layers are only computed once.
    - DESTINATIONS="--destination podcastserver/init-db:$CI_COMMIT_REF_SLUG"
    - if [ -n "$CI_COMMIT_TAG" ]; then DESTINATIONS="$DESTINATIONS --destination podcastserver/init-db:${CI_COMMIT_TAG}" ; fi
    - if [ "$CI_COMMIT_REF_SLUG" == "$CI_DEFAULT_BRANCH" ]; then DESTINATIONS="$DESTINATIONS --destination podcastserver/init-db:latest" ; fi
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/backend-lib-database/src/main/docker/Dockerfile $DESTINATIONS
🧪 init-db:
  stage: 🧪 test
  extends: [ .only-on-backend-changes ]
  needs: [ 🐳 init-db ]
  image: postgres:18.6-alpine
  services:
    - name: postgres:18.6-alpine
      alias: db
      variables:
        POSTGRES_USER: pg-user
        POSTGRES_PASSWORD: pg-password
        POSTGRES_DB: podcast-server-db
    - name: podcastserver/init-db:$CI_COMMIT_REF_SLUG
      alias: flyway
      variables:
        FLYWAY_URL: jdbc:postgresql://db:5432/podcast-server-db
        FLYWAY_USER: pg-user
        FLYWAY_PASSWORD: pg-password
        FLYWAY_CONNECT_RETRIES: 10
  variables:
    PGHOST: db
    PGUSER: pg-user
    PGPASSWORD: pg-password
    PGDATABASE: podcast-server-db
  script:
    - sleep 15
    - psql -c "SELECT count(*) FROM flyway_schema_history"
    - psql -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public'" | grep podcast
  retry: 2

🐳 storage:
  stage: 🐳 packaging
  extends: [ .only-on-storage-changes ]
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - !reference [ .cicd_utils ]
    - kaniko_auth_docker_hub
  script:
    - export VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    - export PROJECT_DIR=$CI_PROJECT_DIR/storage
    - DESTINATIONS="--destination podcastserver/storage:${VERSION}"
    - if [ "$VERSION" == "$CI_DEFAULT_BRANCH" ]; then DESTINATIONS="$DESTINATIONS --destination podcastserver/storage:latest" ; fi
    - /kaniko/executor --context $PROJECT_DIR --dockerfile $PROJECT_DIR/Dockerfile $DESTINATIONS
🐳 ui:
  stage: 🐳 packaging
  extends: [ .only-on-frontend-changes ]
  needs: [👷 ui-v3]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - !reference [ .cicd_utils ]
    - kaniko_auth_docker_hub
  script:
    - sh ./ui/compile.sh
    - export VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    - export PROJECT_DIR=$CI_PROJECT_DIR/ui/target/docker/
    - DESTINATIONS="--destination podcastserver/ui:${VERSION}"
    - if [ "$VERSION" == "$CI_DEFAULT_BRANCH" ]; then DESTINATIONS="$DESTINATIONS --destination podcastserver/ui:latest" ; fi
    - /kaniko/executor --context $PROJECT_DIR --dockerfile $PROJECT_DIR/Dockerfile $DESTINATIONS
