nameReference:
  - kind: Secret
    version: v1
    fieldSpecs:
      - version: v1beta1
        group: gateway.networking.k8s.io
        kind: Gateway
        path: spec/listeners/tls/certificateRefs/name
  - kind: Service
    fieldSpecs:
      - version: v1beta1
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        path: /spec/rules/backendRefs/name
