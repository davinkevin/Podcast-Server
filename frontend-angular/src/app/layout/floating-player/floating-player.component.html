@if (player.currentItem(); as item) {
  <aside
    class="player"
    [class.player--video]="player.isVideo()"
    [class.player--audio]="!player.isVideo()"
    [attr.aria-label]="'Now playing: ' + item.title"
  >
    @if (player.isVideo()) {
      <div class="player__video-frame">
        <video
          class="player__video"
          [src]="item.proxyURL"
          controls
          autoplay
          (ended)="player.next()"
        ></video>
      </div>
    }

    <div class="player__bar">
      @if (!player.isVideo()) {
        <img class="player__thumb" [src]="item.cover.url" [alt]="item.title" />
      }

      <div class="player__meta">
        <div class="player__title" [title]="item.title">{{ item.title }}</div>
        <div class="player__subtitle" [title]="item.podcast.title">{{ item.podcast.title }}</div>
      </div>

      @if (!player.isVideo()) {
        <audio
          class="player__audio"
          [src]="item.proxyURL"
          controls
          autoplay
          (ended)="player.next()"
        ></audio>
      }

      <div class="player__controls">
        <!-- Queue navigation — always present so the player controls cluster
             stays stable across solo / playlist playback. Prev and next are
             disabled at queue edges (and on solo playback, where the queue
             is a single-element list, both stay disabled). The queue
             popover always shows at least the current item. -->
        <button
          mat-icon-button
          type="button"
          aria-label="Previous in queue"
          matTooltip="Previous"
          [disabled]="!player.hasPrev()"
          (click)="player.prev()"
        >
          <mat-icon>skip_previous</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          aria-label="Next in queue"
          matTooltip="Next"
          [disabled]="!player.hasNext()"
          (click)="player.next()"
        >
          <mat-icon>skip_next</mat-icon>
        </button>
        <ps-player-queue-button />
        <button
          mat-icon-button
          type="button"
          aria-label="Open in VLC"
          matTooltip="Open in VLC"
          (click)="onOpenInVlc(item.proxyURL)"
        >
          <mat-icon>play_circle_outline</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          aria-label="Close player"
          (click)="player.close()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </aside>
}
