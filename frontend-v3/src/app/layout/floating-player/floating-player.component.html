@if (player.currentItem(); as item) {
  <aside
    class="player"
    [class.player--expanded]="player.isExpanded()"
    [class.player--video]="player.isVideo()"
    [class.player--audio]="!player.isVideo()"
    [attr.aria-label]="'Now playing: ' + item.title"
  >
    <!-- Video: one element kept in the DOM in every mode so playback never stops.
         Wrapped in a frame whose absolute position changes between mini and expanded;
         the <video> itself just fills the frame so its intrinsic size is irrelevant. -->
    @if (player.isVideo()) {
      <div class="player__video-frame">
        <video
          class="player__video"
          [src]="item.proxyURL"
          [attr.controls]="player.isExpanded() ? '' : null"
          autoplay
          (click)="player.isExpanded() ? null : player.toggleExpanded()"
        ></video>
      </div>
    }

    <!-- Audio: large cover only in expanded mode. -->
    @if (!player.isVideo() && player.isExpanded()) {
      <img class="player__cover-large" [src]="item.cover.url" [alt]="item.title" />
    }

    <div class="player__bar">
      @if (!player.isVideo()) {
        <button
          class="player__thumb"
          type="button"
          aria-label="Expand"
          (click)="player.toggleExpanded()"
        >
          <img [src]="item.cover.url" [alt]="item.title" />
        </button>
      } @else {
        <!-- 56px slot reserved in the bar layout — the frame's absolute box overlaps this slot in mini mode. -->
        <div class="player__video-slot" aria-hidden="true"></div>
      }

      <div class="player__meta">
        <div class="player__title" [title]="item.title">{{ item.title }}</div>
        <div class="player__subtitle" [title]="item.podcast.title">{{ item.podcast.title }}</div>
      </div>

      @if (!player.isVideo()) {
        <audio class="player__audio" [src]="item.proxyURL" controls autoplay></audio>
      }

      <div class="player__controls">
        @if (player.isExpanded()) {
          <button
            mat-icon-button
            type="button"
            aria-label="Collapse"
            (click)="player.collapse()"
          >
            <mat-icon>keyboard_arrow_down</mat-icon>
          </button>
        } @else {
          <button
            mat-icon-button
            type="button"
            aria-label="Expand"
            (click)="player.toggleExpanded()"
          >
            <mat-icon>open_in_full</mat-icon>
          </button>
        }
        <button
          mat-icon-button
          type="button"
          aria-label="Close player"
          (click)="player.close()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </aside>
}
